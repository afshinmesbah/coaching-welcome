<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرسشنامه اولیه کوچینگ</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f3ee;
      --stone: #e8e0d5;
      --ink:   #2c2825;
      --warm:  #8b6f5e;
      --gold:  #c9a96e;
      --muted: #a09080;
      --error: #c0392b;
    }

    html, body {
      min-height: 100%;
      background: var(--cream);
      font-family: 'Vazirmatn', serif;
      color: var(--ink);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -120px;
      left: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, #e6d5c3 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 4rem;
      min-height: 100vh;
      width: 100%;
    }

    /* Header */
    .rule {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(560px, 100%);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.1s;
    }
    .rule::before {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .rule::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .rule-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

    .form-label {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 0.6rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.2s;
    }

    .form-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.4rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.3s;
    }

    .form-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.4s;
    }

    /* Form container */
    .form-wrap {
      width: min(560px, 100%);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.5s;
    }

    /* Section headers */
    .section-header {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--gold);
      text-transform: uppercase;
      margin: 2.5rem 0 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--stone);
      text-align: right;
    }
    .section-header:first-child { margin-top: 0; }

    /* Question blocks */
    .q-block {
      margin-bottom: 1.8rem;
      text-align: right;
    }

    .q-label {
      display: block;
      font-size: 0.9rem;
      color: var(--ink);
      line-height: 1.7;
      margin-bottom: 0.6rem;
    }

    .q-required {
      color: var(--gold);
      margin-right: 3px;
      font-size: 0.8rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--stone);
      border-radius: 2px;
      padding: 0.75rem 1rem;
      font-family: 'Vazirmatn', serif;
      font-size: 0.9rem;
      color: var(--ink);
      direction: rtl;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      border-color: var(--warm);
      box-shadow: 0 0 0 3px rgba(139,111,94,0.1);
    }

    input.invalid, textarea.invalid {
      border-color: var(--error);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.8;
    }

    .q-error {
      font-size: 0.75rem;
      color: var(--error);
      margin-top: 0.35rem;
      display: none;
    }
    .q-error.visible { display: block; }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--stone);
      margin: 2.5rem 0;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--ink);
      color: var(--cream);
      font-family: 'Vazirmatn', serif;
      font-size: 1rem;
      font-weight: 400;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.25s;
    }
    .submit-btn:hover { background: var(--warm); }
    .submit-btn:disabled { background: var(--muted); cursor: not-allowed; }

    .submit-note {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.8rem;
      text-align: center;
    }

    /* Success screen */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 0;
      width: min(480px, 100%);
    }
    .success-screen.visible { display: flex; }

    .success-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--stone);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 1.4rem;
    }

    .success-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.8rem;
    }

    .success-text {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 2;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(247,243,238,0.4);
      border-top-color: var(--cream);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="rule"><div class="rule-dot"></div></div>
  <p class="form-label">کوچینگ — پرسشنامه اولیه</p>
  <h1 class="form-title" id="formTitle">پرسشنامه اولیه</h1>
  <p class="form-subtitle" id="formSubtitle"></p>

  <div class="form-wrap" id="formWrap">
    <form id="coachingForm" novalidate></form>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-icon">✓</div>
    <p class="success-title">با تشکر!</p>
    <p class="success-text" id="successMsg">پرسشنامه شما دریافت شد.<br>در دیدار اول منتظرتان هستم.</p>
  </div>
</div>

<script>
  // ── CONFIG — updated by Apps Script on each publish ──────────
  var SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbwIFeRCwQtroTURHbGRyx-bOmKaywe4DZtpI5LjigjlEPP4pAMl3ZAsn5JTlUArjeOz/exec';  // Apps Script Web App URL
  var QUESTIONS  = [
  {
    "section": "اطلاعات مراجع",
    "question_text": "نام و نام خانوادگی",
    "type": "SHORT_ANSWER",
    "required": true
  },
  {
    "section": "اطلاعات مراجع",
    "question_text": "نشانی پست الکترونیک",
    "type": "SHORT_ANSWER",
    "required": true
  },
  {
    "section": "اطلاعات مراجع",
    "question_text": "شماره تلفن همراه",
    "type": "SHORT_ANSWER",
    "required": false
  },
  {
    "section": "اطلاعات مراجع",
    "question_text": "آدرس (شهر و کشور محل سکونت)",
    "type": "SHORT_ANSWER",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱. در دوران بزرگسالی، به عنوان مراجع، در یک رابطه‌ی خصوصی کار کرده‌اید؟ (مثال: با کوچ، مربی تنیس، معلم پیانو، یا تراپیست/درمانگر) در صورتی که بله، تجربه‌تان چطور بود؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۲. چه چالش/هدف اصلی باعث شده که به فکر کوچینگ بیفتید؟",
    "type": "PARAGRAPH",
    "required": true
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۳. این روزها چه چیزی یا چیزهایی باعث اضطراب یا دغدغه فکری شما شده است؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۴. در طی دو سال گذشته، چه تغییرات عمده‌ای تجربه کرده‌اید؟ (مثال: تغییر شغل، نقل مکان، ازدواج)",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۵. مهم‌ترین نقاط قوت شما کدامند؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۶. زمانی را توصیف کنید که در آن بهترین عملکردتان را داشتید.",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۷. سخت‌ترین کاری که تا به حال انجام داده‌اید چیست؟ چطور موفق به انجام آن شدید؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۸. علایق شما کدامند؟ با چه انگیزه‌ای از خواب بیدار می‌شوید؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۹. ارزش‌های اصلی شما کدامند؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۰. چرا فکر می‌کنید «الان» بهترین زمان برای اقدام و تغییر است؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۱. تصور کنید بعد از ده سال تمام رؤیاهایتان برآورده شده‌اند. بهترین خویشتن آینده‌تان را توصیف کنید.",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۲. چه کسی به موفقیت شما علاقه‌مند است؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۳. برای رسیدن به موفقیت باید از چه موانعی عبور کنید؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۴. از من به عنوان کوچ شما چه انتظاری دارید؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۵. اگر در طی دوره کوچینگ چالشی بین ما پیش آمد چطور با هم مطرح کنیم؟",
    "type": "PARAGRAPH",
    "required": false
  },
  {
    "section": "پرسش‌ها",
    "question_text": "۱۶. مورد دیگری هم هست که بخواهید مطرح کنید؟",
    "type": "PARAGRAPH",
    "required": false
  }
];                  // injected by Apps Script
  var CONFIG     = {
  "form_title": "پرسشنامه‌ی اولیه کوچینگ",
  "form_description": "لطفاً پرسشنامه را در فضایی آرام و به دور از شلوغی‌های روزمره تکمیل کنید. هر آنچه به ذهنتان می‌رسد را صادقانه بنویسید؛ هر پاسخ ارزشمند است.",
  "form_disclaimer": "",
  "notify_email": "afshin.mesbah@gmail.com",
  "drive_folder_name": "Coaching-Clients-Questionnaire",
  "confirmation_msg": "ممنون از وقتی که گذاشتید. در دیدار اول منتظرتان هستم!"
};                  // injected by Apps Script
  // ─────────────────────────────────────────────────────────────

  function safeBase64Decode(str) {
    try {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    } catch(e) { return null; }
  }

  // Decode client name from URL
  var encoded = new URLSearchParams(window.location.search).get('c');
  var clientTitle = '', clientName = '', clientDisplay = '';
  if (encoded) {
    var decoded = safeBase64Decode(encoded);
    if (decoded) {
      try { var pp = JSON.parse(decoded); clientTitle = pp.t || ''; clientName = pp.n || ''; }
      catch(e) { clientName = decoded; }
    }
    clientDisplay = clientTitle ? clientTitle + ' ' + clientName : clientName;
  }

  // Set page title
  if (clientDisplay) {
    document.getElementById('formTitle').textContent = clientDisplay + ' عزیز';
    document.getElementById('formSubtitle').textContent = 'لطفاً پرسش‌های زیر را با دقت و صادقانه پاسخ دهید.';
  } else {
    document.getElementById('formTitle').textContent = CONFIG.form_title || 'پرسشنامه اولیه کوچینگ';
    document.getElementById('formSubtitle').textContent = '';
  }

  // Build form from QUESTIONS array
  var form = document.getElementById('coachingForm');
  var lastSection = null;

  QUESTIONS.forEach(function(q, idx) {
    // Section header
    if (q.section && q.section !== lastSection) {
      var sh = document.createElement('div');
      sh.className = 'section-header';
      sh.textContent = q.section;
      form.appendChild(sh);
      lastSection = q.section;
    }

    var block = document.createElement('div');
    block.className = 'q-block';

    var label = document.createElement('label');
    label.className = 'q-label';
    label.setAttribute('for', 'q_' + idx);
    if (q.required) {
      var star = document.createElement('span');
      star.className = 'q-required';
      star.textContent = '*';
      label.appendChild(star);
    }
    label.appendChild(document.createTextNode(q.question_text));
    block.appendChild(label);

    var input;
    if (q.type === 'SHORT_ANSWER') {
      input = document.createElement('input');
      input.type = q.question_text.indexOf('ایمیل') !== -1 || q.question_text.indexOf('الکترونیک') !== -1 ? 'email' : 'text';
      // Pre-fill name field
      if (idx === 0 && clientName) input.value = clientDisplay;
    } else {
      input = document.createElement('textarea');
    }
    input.id    = 'q_' + idx;
    input.name  = 'q_' + idx;
    input.setAttribute('data-required', q.required ? 'true' : 'false');
    input.setAttribute('data-label', q.question_text);
    block.appendChild(input);

    var errMsg = document.createElement('div');
    errMsg.className = 'q-error';
    errMsg.id = 'err_' + idx;
    errMsg.textContent = 'این فیلد الزامی است.';
    block.appendChild(errMsg);

    form.appendChild(block);
  });

  // Submit button
  var divider = document.createElement('div');
  divider.className = 'divider';
  form.appendChild(divider);

  var btn = document.createElement('button');
  btn.type = 'submit';
  btn.className = 'submit-btn';
  btn.id = 'submitBtn';
  btn.textContent = 'ارسال پرسشنامه';
  form.appendChild(btn);

  var note = document.createElement('p');
  note.className = 'submit-note';
  note.textContent = 'پس از ارسال، پاسخ‌های شما ذخیره می‌شود و امکان ویرایش وجود ندارد.';
  form.appendChild(note);

  // Form submission
  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var valid = true;
    QUESTIONS.forEach(function(q, idx) {
      var input = document.getElementById('q_' + idx);
      var err   = document.getElementById('err_' + idx);
      if (q.required && !input.value.trim()) {
        input.classList.add('invalid');
        err.classList.add('visible');
        valid = false;
      } else {
        input.classList.remove('invalid');
        err.classList.remove('visible');
      }
    });

    if (!valid) {
      // Scroll to first error
      var firstErr = form.querySelector('.invalid');
      if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    // Collect answers
    var answers = {};
    QUESTIONS.forEach(function(q, idx) {
      answers['q_' + idx] = {
        label: q.question_text,
        value: document.getElementById('q_' + idx).value.trim()
      };
    });

    var payload = {
      clientName:  clientDisplay || 'Unknown',
      encodedData: encoded || '',
      answers:     answers
    };

    // Disable button and show spinner
    btn.disabled = true;
    btn.innerHTML = 'در حال ارسال<span class="spinner"></span>';

    fetch(SUBMIT_URL, {
      method:  'POST',
      mode:    'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload)
    })
    .then(function() {
      document.getElementById('formWrap').style.display = 'none';
      var success = document.getElementById('successScreen');
      success.classList.add('visible');
      var msg = CONFIG.confirmation_msg || 'پرسشنامه شما دریافت شد. در دیدار اول منتظرتان هستم.';
      document.getElementById('successMsg').innerHTML = msg;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'ارسال پرسشنامه';
      alert('خطا در ارسال. لطفاً اتصال اینترنت خود را بررسی کرده و دوباره امتحان کنید.');
    });
  });
</script>
</body>
</html>
