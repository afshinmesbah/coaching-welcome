<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خوش آمدید</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f3ee;
      --stone: #e8e0d5;
      --ink:   #2c2825;
      --warm:  #8b6f5e;
      --gold:  #c9a96e;
      --muted: #a09080;
    }

    html, body {
      min-height: 100%;
      background: var(--cream);
      font-family: 'Vazirmatn', serif;
      color: var(--ink);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -120px;
      left: -120px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, #e6d5c3 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem 3rem;
      text-align: center;
      min-height: 100vh;
      width: 100%;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .rule {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(340px, 90%);
      margin-bottom: 2.4rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.1s;
    }
    .rule::before {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .rule::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .rule-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    .greeting-label {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.25s;
    }

    .greeting-name {
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.45s;
    }

    .greeting-welcome {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 300;
      color: var(--warm);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.6s;
    }

    .sub-text {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 2;
      max-width: 480px;
      text-align: justify;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.75s;
    }

    .divider {
      width: min(340px, 90%);
      height: 1px;
      background: var(--stone);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.85s;
    }

    .cta-btn {
      display: inline-block;
      padding: 0.9rem 3rem;
      background: var(--ink);
      color: var(--cream);
      font-family: 'Vazirmatn', serif;
      font-size: 1rem;
      font-weight: 400;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: background 0.25s;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.95s;
    }
    .cta-btn:hover { background: var(--warm); }

    .countdown-note {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 1rem;
      min-height: 1.4em;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 1.1s;
    }

    .progress-wrap {
      width: min(340px, 90%);
      height: 3px;
      background: var(--stone);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 1.1s;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, var(--warm), var(--gold));
    }

    .error-state {
      font-size: 1rem;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.3s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="page" id="page">
  <div class="rule"><div class="rule-dot"></div></div>
  <div id="main-content" class="main-content"></div>
</div>

<script>
  var FORM_URL       = 'https://docs.google.com/forms/d/e/1FAIpQLSdUfe4GR3ue0wGe9TGsK00xjrVmtOl_Zj1oZzoHrlvSOQINFA/viewform';
  var REDIRECT_DELAY = 120;

  function safeBase64Decode(str) {
    try {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(escape(atob(str)));
    } catch(e) { return null; }
  }

  var encoded = new URLSearchParams(window.location.search).get('c');
  var page    = document.getElementById('page');
  var content = document.getElementById('main-content');

  if (!encoded) {
    content.innerHTML = '<p class="error-state">لینک معتبر نیست. لطفاً لینک صحیح را از کوچ خود دریافت کنید.</p>';
  } else {
    var decoded = safeBase64Decode(encoded);
    var title = '', name = '';
    if (decoded) {
      try { var p = JSON.parse(decoded); title = p.t || ''; name = p.n || decoded; }
      catch(e) { name = decoded; }
    }
    var displayName = title ? title + ' ' + name : name;

    content.innerHTML =
      '<p class="greeting-label">پرسشنامه اولیه کوچینگ</p>' +
      '<h1 class="greeting-name">' + displayName + '،</h1>' +
      '<p class="greeting-welcome">خوش آمدید</p>' +
      '<p class="sub-text">' +
        'تبریک! شما گام مهمی رو به جلو برداشته‌اید.<br><br>' +
        'این پرسشنامه شامل سؤالات مهمی است که بهتر است پیش از اولین جلسه به آن‌ها فکر کنید. پیشنهاد می‌کنم زمانی مناسب (حدود ۴۵ دقیقه) را در فضایی آرام و بدون مزاحمت برای تکمیل آن اختصاص دهید و هر آنچه به ذهنتان می‌رسد را صادقانه و بدون نگرانی بنویسید. هر پاسخی ارزشمند است.<br><br>' +
        'لطفاً این پرسشنامه را حداکثر ۴۸ ساعت پیش از جلسه اول تکمیل فرمایید تا فرصت کافی برای مطالعه و بررسی آن را داشته باشم.<br><br>' +
        'سپاس' +
        'افشین مصباح' +
      '</p>' +
      '<div class="divider"></div>' +
      '<a href="' + FORM_URL + '" class="cta-btn" id="formBtn">ورود به پرسشنامه</a>' +
      '<div class="countdown-note" id="countdownNote"></div>' +
      '<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>';

    var bar  = document.getElementById('progressBar');
    var note = document.getElementById('countdownNote');
    var btn  = document.getElementById('formBtn');
    var elapsed = 0, done = false;
    var total = REDIRECT_DELAY * 1000;

    var timer = setInterval(function() {
      if (done) return;
      elapsed += 100;
      bar.style.width = ((elapsed / total) * 100) + '%';
      note.textContent = 'انتقال خودکار به پرسشنامه در ' + Math.ceil((total - elapsed) / 1000) + ' ثانیه';
      if (elapsed >= total) {
        done = true;
        clearInterval(timer);
        window.location.href = FORM_URL;
      }
    }, 100);

    btn.addEventListener('click', function() {
      done = true;
      clearInterval(timer);
      note.textContent = '';
      bar.style.width = '100%';
    });
  }
</script>
</body>
</html>
